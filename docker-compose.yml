name: signal-lost

services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal_lost
      POSTGRES_USER: signal_lost
      POSTGRES_PASSWORD: local_development_only
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U signal_lost -d signal_lost
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - signal_lost_postgres:/var/lib/postgresql

volumes:
  signal_lost_postgres:
