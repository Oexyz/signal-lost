name: Bug report
description: Report a reproducible defect that does not contain sensitive security information.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private room data, canonical scenario secrets, or vulnerability details.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and which role or public route was affected?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit or release identifier, if known.
