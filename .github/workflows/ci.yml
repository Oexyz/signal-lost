name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify public browser routes and origins
        run: pnpm test:e2e

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate local database definition
        run: docker compose config --quiet

      - name: Build production server image
        run: docker build --tag signal-lost-server:ci .

      - name: Verify production server image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name signal-lost-server-ci --publish 127.0.0.1:3000:3000 signal-lost-server:ci
          trap 'docker rm --force signal-lost-server-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs signal-lost-server-ci
              exit 1
            fi
            sleep 1
          done

          test "$(docker exec signal-lost-server-ci node -e 'process.stdout.write(String(process.getuid?.()))')" = "1000"
          curl --fail --silent http://127.0.0.1:3000/health/ready | grep --fixed-strings '"status":"ok"'
          docker stop --time 10 signal-lost-server-ci >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' signal-lost-server-ci)" = "0"
